plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Репозиторій для owo-lib
    maven { url 'https://maven.wispforest.io/releases/' }
    // Репозиторій для Fabric API та інших модів
    maven { url 'https://maven.terraformersmc.com/' }
}

dependencies {
    // Minecraft та Fabric Loader
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (необхідний для Networking та подій)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // oωo-lib для твого GUI
    // Версія 0.12.15+1.21 стабільна для 1.21.1
    modImplementation "io.wispforest:owo-lib:0.12.15+1.21"

    // Включаємо бібліотеку в мод, щоб вона працювала у гравців без окремого встановлення
    include "io.wispforest:owo-lib:0.12.15+1.21"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Тут можна налаштувати публікацію, якщо потрібно
    }
}